<main id="main"><div class="article-wrap"><a class="back" href="../index.html?category=生活随笔">返回生活随笔</a><article class="article"><div class="post-meta"><span class="category">生活随笔</span><time datetime="2026-09-20">2026-09-20</time><span>示例文章</span></div><h1>一些值得记住的小事</h1><p class="article-intro">窗边的光、一段闲聊、一本读到一半的书。平常的日子也有值得保存的细节。</p><div class="article-body"><section><h2>记住具体的细节</h2><p>这是一篇示例文章。</p><p>记录生活不一定要写很长。可以从一个具体的细节开始：今天喝的茶是什么味道，路上遇到什么人，哪一句话让自己停了一下。</p><p>当这些细节被写下来，原本模糊的一天就变得可以回看。</p></section></div></article><a class="back bottom-back" href="../index.html">浏览全部文章</a></div></main><footer><span>cw.pang-blog <span class="muted">/ 生活 · 科研 · 学习</span></span><span class="muted">把走过的路，写成自己的文字。</span></footer></body></html>
